<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>MineCodex</title>
    <link rel="icon" href="/favicon.svg?v=minecodex-1" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css?v=mcx-native-1">
    <script type="module" src="/app.js?v=mcx-native-1"></script>
    <script type="module" src="/assets/data-transfer.js"></script>
  </head>
  <body>
    <div class="dashboard-surface">
    <main class="shell">
      <div class="header-actions">
          <div class="language-toggle">
            <button id="language-button" class="language-button" type="button" popovertarget="language-menu" aria-haspopup="true" aria-expanded="false"><span class="ui-icon language-icon" aria-hidden="true"></span></button>
            <div id="language-menu" class="language-menu" popover="auto" role="group" aria-label="Language">
              <button data-language-choice="zh-CN" type="button" lang="zh-CN" aria-pressed="false">中文</button>
              <button data-language-choice="en" type="button" lang="en" aria-pressed="false">English</button>
            </div>
          </div>
          <div class="theme-toggle" role="group" aria-label="Appearance">
            <button id="theme-button" data-theme-choice="light" type="button" aria-label="Light appearance"><span class="ui-icon sun-icon" aria-hidden="true"></span></button>
          </div>
      </div>
      <header class="page-header">
        <h1><span class="brand-icon" aria-hidden="true"></span><span class="brand-name">MineCodex</span></h1>
        <p id="brand-slogan" class="brand-slogan"></p>
        <p id="brand-description" class="brand-description"></p>
      </header>
      <section id="restart-notice" class="restart-notice" hidden aria-live="polite">
        <span class="notice-icon ui-icon info-icon" aria-hidden="true"></span>
        <div class="notice-copy">
          <h2 id="restart-title">Restart Codex to apply changes</h2>
          <p id="restart-copy">Your plugin choices are saved. Restart when you are ready.</p>
        </div>
        <button id="restart-button" class="button primary" type="button">
          <span class="button-label">Restart Codex</span>
        </button>
      </section>

      <section aria-labelledby="plugins-heading">
        <h2 id="plugins-heading" class="sr-only">Your extensions</h2>
        <span id="save-state" class="sr-only" aria-live="polite"></span>

        <div id="plugin-list" class="plugin-list" aria-busy="true">
          <div class="plugin-skeleton"></div>
          <div class="plugin-skeleton"></div>
          <div class="plugin-skeleton"></div>
        </div>

        <div id="load-error" class="error-state" hidden role="alert">
          <span class="notice-icon ui-icon alert-icon" aria-hidden="true"></span>
          <div class="notice-copy">
            <strong id="error-title">Couldn’t load MineCodex</strong>
            <p id="error-copy">Check that the background service is running.</p>
          </div>
          <button id="retry-button" class="button secondary" type="button">Try again</button>
        </div>
      </section>

      <footer class="diagnostics">
        <div class="diagnostics-version">
          <dl>
            <div><dt id="version-label">Version</dt><dd id="version-value">—</dd></div>
          </dl>
          <button id="update-button" class="button quiet" type="button"><span class="ui-icon refresh-icon" aria-hidden="true"></span><span class="button-label">Check for updates</span></button>
        </div>
        <div class="diagnostics-actions">
          <button id="data-button" class="button secondary" type="button">Transfer data</button>
          <button id="diagnostics-button" class="button secondary" type="button">Copy diagnostics</button>
        </div>
      </footer>
      <p id="update-result" class="update-result" role="status" hidden></p>
    </main>
    <dialog id="data-dialog" class="data-dialog" aria-labelledby="data-title">
      <header class="data-header"><div><h2 id="data-title">Transfer data</h2></div><button id="data-close" class="button quiet" type="button" aria-label="Close"><svg viewBox="0 0 21 21" fill="none" aria-hidden="true"><path d="M14.6549 5.57307C14.9283 5.2997 15.3718 5.2997 15.6451 5.57307C15.9185 5.84643 15.9185 6.28993 15.6451 6.5633L11.3903 10.8182L15.6451 15.0731L15.735 15.1834C15.9141 15.4551 15.8842 15.8242 15.6451 16.0633C15.4061 16.3024 15.0369 16.3322 14.7653 16.1531L14.6549 16.0633L10.4 11.8084L6.14515 16.0633C5.87178 16.3367 5.42828 16.3367 5.15492 16.0633C4.88155 15.7899 4.88155 15.3464 5.15492 15.0731L9.4098 10.8182L5.15492 6.5633L5.06507 6.45295C4.88597 6.18128 4.91584 5.81214 5.15492 5.57307C5.39399 5.33399 5.76313 5.30413 6.0348 5.48322L6.14515 5.57307L10.4 9.82795L14.6549 5.57307Z" fill="currentColor"/></svg></button></header>
      <div id="data-list" class="data-list"></div>
      <p id="data-policy" class="data-policy"></p>
      <p id="data-status" class="data-help data-status" role="status" aria-live="polite"></p>
      <footer class="data-actions"><button id="data-export" class="button secondary" type="button"><span class="ui-icon download-icon" aria-hidden="true"></span><span class="button-label">Export</span></button><button id="data-import" class="button secondary" type="button"><span class="ui-icon upload-icon" aria-hidden="true"></span><span class="button-label">Import</span></button></footer>
      <input id="data-file" type="file" accept=".json,.mcx.json,application/json" hidden>
    </dialog>
    <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
    </div>
  </body>
</html>
