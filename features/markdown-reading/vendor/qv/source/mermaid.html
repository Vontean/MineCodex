nodes.forEach(n=>{const button=document.createElement('button');button.type='button';button.className='node';button.dataset.layer=n.layer;button.dataset.shape=n.shape||'rect';if(n.junction)button.classList.add('junction');button.dataset.node=n.id;if(n.groupCard)button.classList.add('group-card');if(n.external)button.classList.add('external');button.style.cssText=`left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px`;setContainmentSurface(button,n.targetGroup!==undefined?n.targetGroup:n.id);button.setAttribute('aria-label',n.name);const label=document.createElement('span');label.className='name';if(useIcons&&!n.junction){const icon=document.createElement('i');icon.setAttribute('data-lucide',n.icon);icon.setAttribute('aria-hidden','true');label.append(icon);}if(!n.junction){if(sourceModel.architecture||sourceModel.kind==='flowchart'){const text=document.createElement('span');text.className=sourceModel.architecture?'architecture-name':'flowchart-name';text.textContent=n.name;label.append(text);}else label.append(document.createTextNode(n.name));}if(n.textWidth&&!n.groupCard){label.style.width=n.textWidth+'px';label.style.lineHeight=n.labelLine+'px';}button.append(label);if(n.groupCard){const detail=document.createElement('span');detail.className='group-detail';detail.append(document.createTextNode(n.count+' 个节点'));const arrow=document.createElement('i');arrow.setAttribute('data-lucide','chevron-right');arrow.setAttribute('aria-hidden','true');const enter=document.createElement('span');enter.className='group-enter';enter.append(arrow);label.append(enter);button.append(detail);if(n.preview)drawGroupPreview(n,button);button.setAttribute('aria-label',n.name+'，'+n.count+' 个节点，进入分组');button.onclick=e=>navigateScope(n.targetGroup,e.detail===0,n.button);}
if(n.external){if(n.targetGroup!==undefined){button.classList.add('external-group');const arrow=document.createElement('i');arrow.setAttribute('data-lucide','arrow-up-right');arrow.setAttribute('aria-hidden','true');label.append(arrow);label.style.width='100%';button.setAttribute('aria-label',n.name+'，'+(n.targetGroup===null?'返回总览':'进入此分组'));button.onclick=e=>navigateScope(n.targetGroup,e.detail===0,n.button);}else{const context=document.createElement('span');context.className='external-label';context.textContent='来自其他分组';button.append(context);}}
if(n.shape&& !['rect','round'].includes(n.shape))drawNodeShape(n,button);button.onpointerenter=e=>queueNodeHover(n,e);button.onpointermove=e=>{if(activeNode!==n.id&&root.dataset.motion!=='running')queueNodeHover(n,e);};button.onpointerleave=leaveNodeHover;button.onfocus=()=>showTip(n);button.onblur=clear;if(sourceModel.architecture&&!button.onclick)button.onclick=()=>showTip(n,{type:'click'});scene.append(button);n.button=button;if(!reduced.matches)motionSpecs.push(()=>button.animate([{opacity:0,transform:'scale(.08)',offset:0},{opacity:1,transform:'scale(.7)',offset:.55},{opacity:1,transform:'scale(1)',offset:1}],{duration:240,delay:n.layer*220,easing:'cubic-bezier(.2,.65,.3,1)',fill:'backwards'}));});
if(window.lucide)window.lucide.createIcons({attrs:{width:16,height:16}});
architectureReader?.refresh();diagramViewport.refresh();
}
let crumbPanel,crumbAnchor,crumbCloseTimer,crumbOpenTimer;
function closeCrumbPanel(){clearTimeout(crumbOpenTimer);clearTimeout(crumbCloseTimer);if(crumbPanel?.matches(':popover-open'))crumbPanel.hidePopover();crumbAnchor?.setAttribute('aria-expanded','false');}
function openCrumbPanel(anchor,group,keyboard=false){
 if(navigationBusy||!drilldownActive||group.id===null)return;closeCrumbPanel();crumbAnchor=anchor;
 if(!crumbPanel){crumbPanel=document.createElement('div');crumbPanel.className='scope-peers';crumbPanel.setAttribute('popover','auto');crumbPanel.setAttribute('aria-label','同层级分组');root.append(crumbPanel);
 crumbPanel.onpointerenter=()=>clearTimeout(crumbCloseTimer);crumbPanel.onpointerleave=()=>crumbCloseTimer=setTimeout(closeCrumbPanel,180);
 crumbPanel.addEventListener('toggle',()=>{if(!crumbPanel.matches(':popover-open'))crumbAnchor?.setAttribute('aria-expanded','false');});
 crumbPanel.onkeydown=e=>{const items=[...crumbPanel.querySelectorAll('button')],i=items.indexOf(document.activeElement);if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();items[e.key==='Home'?0:e.key==='End'?items.length-1:(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length]?.focus();}else if(e.key==='Escape'){e.preventDefault();closeCrumbPanel();crumbAnchor?.focus({preventScroll:true});}};
 }
 crumbPanel.replaceChildren();const peers=sourceModel.groups.filter(g=>(g.parent||null)===(group.id===null?null:group.parent||null));
 for(const peer of peers){const item=document.createElement('button');item.type='button';item.textContent=peer.name;item.dataset.peer=peer.id;if(peer.id===group.id)item.setAttribute('aria-current','location');item.onclick=e=>{closeCrumbPanel();navigateScope(peer.id,e.detail===0);};crumbPanel.append(item);}
 if(!peers.length)return;
 crumbPanel.style.visibility='hidden';crumbPanel.showPopover();anchor.setAttribute('aria-expanded','true');const box=anchor.getBoundingClientRect(),w=crumbPanel.offsetWidth,h=crumbPanel.offsetHeight;
 crumbPanel.style.left=Math.max(8,Math.min(innerWidth-w-8,box.left))+'px';crumbPanel.style.top=(box.bottom+6+h<=innerHeight-8?box.bottom+6:Math.max(8,box.top-h-6))+'px';crumbPanel.style.visibility='';if(keyboard)crumbPanel.querySelector('button')?.focus({preventScroll:true});
}
function drawNavigation(){
 closeCrumbPanel();const nav=root.querySelector('.scope-nav');nav.hidden=!navigationEnabled;if(!navigationEnabled)return;nav.replaceChildren();
 const groups=new Map(sourceModel.groups.map(g=>[g.id,g])),path=[];for(let g=groups.get(currentScope);g;g=groups.get(g.parent))path.unshift(g);
 function button(name,target,icon){const b=document.createElement('button');b.type='button';b.disabled=navigationBusy;b.dataset.scope=target||'';if(icon){const i=document.createElement('i');i.setAttribute('data-lucide',icon);i.setAttribute('aria-hidden','true');b.append(i);b.setAttribute('aria-label',name);}else b.textContent=name;b.onclick=e=>navigateScope(target,e.detail===0);nav.append(b);return b;}

 const crumbs=[{id:null,name:drilldownActive?'总览':'完整架构'},...path];crumbs.forEach((g,index)=>{
  if(index){const sep=document.createElement('span');sep.textContent='/';sep.setAttribute('aria-hidden','true');nav.append(sep);}
  const crumb=button(g.name,g.id);crumb.dataset.crumb=g.id||'overview';if(index===crumbs.length-1)crumb.setAttribute('aria-current','location');
  if(drilldownActive&&g.id!==null){crumb.setAttribute('aria-haspopup','true');crumb.setAttribute('aria-expanded','false');crumb.onpointerenter=()=>{clearTimeout(crumbCloseTimer);clearTimeout(crumbOpenTimer);crumbOpenTimer=setTimeout(()=>openCrumbPanel(crumb,g),120);};crumb.onpointerleave=()=>{clearTimeout(crumbOpenTimer);crumbCloseTimer=setTimeout(closeCrumbPanel,180);};crumb.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();openCrumbPanel(crumb,g,true);}};}
 });
 const control=document.createElement('label');control.className='form-check form-switch scope-toggle';const input=document.createElement('input');input.type='checkbox';input.className='form-check-input';input.setAttribute('role','switch');input.checked=drilldownActive;input.disabled=navigationBusy;input.onchange=()=>setNavigationMode(input.checked);const text=document.createElement('span');text.className='form-check-label';text.textContent='节点组';control.append(text,input);nav.append(control);
 if(window.lucide)window.lucide.createIcons({attrs:{width:16,height:16}});
}
function capturePositions(){return new Map(nodes.map(n=>[n.id,n.button.getBoundingClientRect()]));}
function transitionView(before,anchor,keyboard){
 runningAnimations.forEach(a=>a.cancel());runningAnimations=[];clearTimeout(finishTimer);root.dataset.motion='complete';
 if(reduced.matches||keyboard||diagramViewport.expanded)return;
 const ease='cubic-bezier(.22,1,.36,1)';
 if(anchor){const target=scene.getBoundingClientRect(),ghost=document.createElement('div');ghost.className='scope-envelope';ghost.style.cssText=`left:0;top:0;width:${target.width}px;height:${target.height}px`;scene.append(ghost);const dx=anchor.x-target.x,dy=anchor.y-target.y;const anim=ghost.animate([{transform:`translate(${dx}px,${dy}px) scale(${anchor.width/target.width},${anchor.height/target.height})`,opacity:.7},{transform:'translate(0,0) scale(1)',opacity:0}],{duration:360,easing:ease});runningAnimations.push(anim);anim.finished.catch(()=>{}).finally(()=>ghost.remove());}

 nodes.forEach(n=>{const end=n.button.getBoundingClientRect(),old=before.get(n.id)||anchor,dx=old?old.x+old.width/2-end.x-end.width/2:0,dy=old?old.y+old.height/2-end.y-end.height/2:12;
 runningAnimations.push(n.button.animate([{transform:`translate(${dx}px,${dy}px) scale(${before.has(n.id)?1:.94})`,opacity:before.has(n.id)?1:0},{transform:'translate(0,0) scale(1)',opacity:1}],{duration:360,easing:ease}));
 });
 edges.forEach(e=>{const path=e.path,length=path.getTotalLength(),mask=svg.querySelector('#'+CSS.escape(path.getAttribute('mask')?.slice(5,-1)||''));if(mask){const reveal=mask.querySelector('path');runningAnimations.push(reveal.animate([{strokeDashoffset:length},{strokeDashoffset:0}],{duration:380,delay:60,easing:'cubic-bezier(.2,.7,.3,1)',fill:'backwards'}));}});
 arrows.forEach(a=>runningAnimations.push(a.el.animate([{opacity:0},{opacity:1}],{duration:140,delay:220,fill:'backwards'})));
}
async function setNavigationMode(enabled){
 if(navigationBusy)return;navigationBusy=true;clear();drawNavigation();viewport.setAttribute('aria-busy','true');
 try{
  const next=enabled?mermaidScopeView(sourceModel):{...sourceModel,nodes:sourceModel.nodes.map(n=>({...n})),edges:sourceModel.edges.map(e=>({...e})),groups:(sourceModel.groups||[]).map(g=>({...g}))};
  if(enabled)await prepareNavigationView(next);else if(next.kind==='flowchart')await prepareFlowchartLayout(next,mermaidRuntime,cfg.source);else if(next.nativeGeometry)await prepareNativeGeometry(next,mermaidRuntime,cfg.source,next.db,next.architecture);else if(next.generic)await prepareMermaidLayout(next);
  data=next;drilldownActive=enabled;currentScope=null;root.dataset.navigation=String(enabled);root.dataset.scope=enabled?'overview':'expanded';
  scene.style.minWidth=(data.layout?data.layout.width:data.grouped?Math.max(736,Math.max(...data.layers.map((_,i)=>data.nodes.filter(n=>n.layer===i).length))*150-18):Math.max(560,data.layers.length*160+(data.layers.length-1)*48))+'px';
  draw();viewport.scrollLeft=0;playMotion();root.querySelector('.scope-status').textContent=enabled?'节点组':'完整架构';
 }catch(error){notice.hidden=false;notice.textContent='无法切换视图：'+error.message;}
 finally{navigationBusy=false;viewport.setAttribute('aria-busy','false');drawNavigation();root.querySelector('.scope-toggle input')?.focus({preventScroll:true});}
}
async function navigateScope(scope,keyboard=false,origin=null){
 if(navigationBusy||!drilldownActive||scope===currentScope)return;
 navigationBusy=true;clear();drawNavigation();viewport.setAttribute('aria-busy','true');scopeScroll.set(currentScope,viewport.scrollLeft);
 try{const before=capturePositions(),anchor=origin?.getBoundingClientRect();const next=mermaidScopeView(sourceModel,scope);await prepareCompleteScope(next,root.clientWidth);data=next;currentScope=scope;root.dataset.scope=scope||'overview';scene.style.minWidth=data.layout.width+'px';draw();viewport.scrollLeft=scopeScroll.get(scope)||0;transitionView(before,anchor,keyboard);root.querySelector('.scope-status').textContent='已进入'+(sourceModel.groups.find(g=>g.id===scope)?.name||'总览');}
 catch(error){notice.hidden=false;notice.textContent='无法进入分组：'+error.message;}
 finally{navigationBusy=false;viewport.setAttribute('aria-busy','false');drawNavigation();if(keyboard)root.querySelector('.scope-nav button')?.focus({preventScroll:true});}
}
if(sourceModel.architecture)architectureReader=createArchitectureReader(root,sourceModel,viewport,diagramViewport,focus,()=>clearTimeout(leaveTimer),leaveNodeHover);
drawNavigation();
new ResizeObserver(()=>requestAnimationFrame(()=>{if(architectureReader)architectureReader.refresh();else clear();})).observe(root);viewport.addEventListener('scroll',()=>{if(architectureReader)architectureReader.onScroll();else clear();},{passive:true});viewport.addEventListener('pointermove',e=>{if(sourceModel.kind==='flowchart'&&activeNode&&!e.target.closest('button.node')){clearTimeout(leaveTimer);leaveTimer=setTimeout(clear,220);}},{passive:true});root.onpointerleave=leaveNodeHover;document.addEventListener('keydown',e=>{if(e.key==='Escape')clear();});function playMotion(){if(diagramViewport.expanded){runningAnimations.forEach(a=>a.cancel());root.dataset.motion='complete';return;}clear();runningAnimations.forEach(a=>a.cancel());root.dataset.motion=reduced.matches?'complete':'running';root.dataset.replays=String(+(root.dataset.replays||0)+1);runningAnimations=reduced.matches?[]:motionSpecs.map(start=>start());clearTimeout(finishTimer);finishTimer=setTimeout(()=>root.dataset.motion='complete',Math.max(...data.nodes.map(n=>n.layer))*220+810);}
function scheduleEntry(){clearTimeout(replayTimer);replayTimer=setTimeout(()=>{replayTimer=null;if(visible&&!document.hidden){playMotion();}else armed=true;},80);}
function replay(){if(visible&&armed&&!document.hidden){armed=false;scheduleEntry();}}
reduced.addEventListener('change',()=>{runningAnimations.forEach(a=>a.cancel());root.dataset.motion='complete';});
new IntersectionObserver(es=>{const e=es[0];if(!e.isIntersecting){visible=false;armed=true;}else if(e.intersectionRatio>=.2||(e.rootBounds&&e.boundingClientRect.height>e.rootBounds.height)){visible=true;replay();}},{threshold:[0,.2]}).observe(root);
document.addEventListener('visibilitychange',()=>{if(document.hidden)armed=true;else replay();});new ResizeObserver(()=>{if(scene.clientWidth!==lastWidth){draw();if(replayTimer)scheduleEntry();}}).observe(scene);draw();finishLoading();
root.addEventListener('qv:display-mode',()=>{closeCrumbPanel();clear();architectureReader?.refresh();clearTimeout(replayTimer);clearTimeout(finishTimer);runningAnimations.forEach(a=>a.cancel());root.dataset.motion='complete';});
})();
